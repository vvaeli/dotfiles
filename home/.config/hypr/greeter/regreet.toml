skip_selection = false

[background]
path = "/etc/greetd/md3/background.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
cursor_blink = true
font_name = "Adwaita Sans 12"
icon_theme_name = "Adwaita"
theme_name = "Adwaita"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]
x11_prefix = ["startx", "/usr/bin/env"]

[appearance]
greeting_msg = "Добро пожаловать, @USER@"

[widget.clock]
format = "%d.%m.%Y  ·  %H:%M"
resolution = "1s"
label_width = 200
