# Reference block for hyprland.conf. The active setup uses Lua.
bind = , Print, exec, /usr/bin/bash @HOME@/.config/hypr/scripts/screenshot area
bind = SHIFT, Print, exec, /usr/bin/bash @HOME@/.config/hypr/scripts/screenshot screen --no-edit
bind = SUPER, Print, exec, /usr/bin/bash @HOME@/.config/hypr/scripts/screenshot active
bind = CTRL, Print, exec, /usr/bin/bash @HOME@/.config/hypr/scripts/screenshot area --no-edit
# Optional strict window picker:
# bind = SUPER SHIFT, Print, exec, /usr/bin/bash @HOME@/.config/hypr/scripts/screenshot window
