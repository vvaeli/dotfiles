# Material 3 lock screen used by the bar's lock button.
# Colors follow the wallpaper: matugen writes hyprlock-colors.conf.
source = ~/.config/hypr/hyprlock-colors.conf
general {
    hide_cursor = true
}
background {
    monitor =
    color = $md3_surface
}
label {
    monitor =
    text = $TIME
    color = $md3_primary
    font_size = 80
    font_family = Adwaita Sans
    position = 0, 120
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 0
    rounding = 28
    inner_color = $md3_surface
    outer_color = $md3_primary
    font_color = $md3_on_surface
    check_color = $md3_success
    fail_color = $md3_error
    font_family = Adwaita Sans
    placeholder_text = Пароль
    fail_text = $PAMFAIL
    fade_on_empty = false
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = $md3_muted
    font_size = 18
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = center
}
animations {
    enabled = true
    bezier = md3, 0.2, 0.0, 0.0, 1.0
    animation = fadeIn, 1, 3, md3
    animation = fadeOut, 1, 2, md3
}
